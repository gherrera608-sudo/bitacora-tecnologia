{% extends 'layout.html' %}
{% block title %}Confirmar Recepción{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-slate-950 border border-slate-800 rounded-2xl p-6">
    <h1 class="text-xl font-bold text-white mb-4 text-center">Confirmación Estudiante</h1>
    <form action="{{ url_for('vista_estudiante') }}" method="GET" class="mb-6">
        <label class="text-xs font-semibold text-slate-300 block mb-1">Digita el N° de Inventario</label>
        <div class="flex gap-2">
            <input type="text" name="inv" value="{{ inv_query }}" placeholder="Ej: TEC-001" required class="flex-grow bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white font-mono uppercase">
            <button type="submit" class="bg-slate-800 text-white px-4 py-2 rounded-xl text-sm">Buscar</button>
        </div>
    </form>

    {% if prestamo %}
    <form action="{{ url_for('vista_estudiante') }}" method="POST" class="space-y-4 border-t border-slate-800 pt-4">
        <input type="hidden" name="inventario" value="{{ prestamo.inventario }}">
        <div class="text-xs bg-slate-900 p-3 rounded-xl border border-slate-800">
            <div>Estudiante: <b>{{ prestamo.estudiante }}</b></div>
            <div>Equipo: <b class="text-blue-400">{{ prestamo.marca_modelo }}</b></div>
        </div>
        <div>
            <label class="text-xs font-semibold text-slate-300 block mb-1">¿Recibiste el cargador?</label>
            <div class="flex gap-4">
                <label class="text-sm"><input type="radio" name="cargador_recibido" value="Sí" checked> Sí, vino cargador</label>
                <label class="text-sm"><input type="radio" name="cargador_recibido" value="No"> No vino cargador</label>
            </div>
        </div>
        <div><label class="text-xs font-semibold text-slate-300 block mb-1">Observaciones / Daños</label><textarea name="reporte" rows="3" placeholder="Si tiene alguna falla o daño, escríbelo aquí..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm"></textarea></div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-xl">Confirmar Recepción</button>
    </form>
    {% endif %}
</div>
{% endblock %}
