{% extends 'layout.html' %}
{% block title %}Registrar Entrega{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto bg-zinc-950 border border-zinc-800 rounded-2xl p-6 shadow-xl shadow-black/40">
    <div class="flex items-center gap-3 mb-6 pb-3 border-b border-zinc-800">
        <div class="w-2 h-6 bg-red-600 rounded-full"></div>
        <h1 class="text-xl font-bold text-white tracking-wide">Entrega de Equipo (Profesor)</h1>
    </div>
    <form action="{{ url_for('vista_profesor') }}" method="POST" class="space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="text-xs font-semibold text-zinc-300">Nombre del Profesor</label>
                <input type="text" name="profesor" placeholder="Ej: Lic. Juan Pérez" required class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white outline-none transition">
            </div>
            <div>
                <label class="text-xs font-semibold text-zinc-300">Asignatura / Especialidad</label>
                <select name="asignatura" class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white outline-none transition">
                    <option value="Tecnología Informática">Tecnología Informática</option>
                    <option value="Secretariado Ejecutivo">Secretariado Ejecutivo</option>
                    <option value="Contabilidad">Contabilidad</option>
                    <option value="Formación Tecnológica">Formación Tecnológica</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="text-xs font-semibold text-zinc-300">N° Inventario</label>
                <input type="text" name="inventario" placeholder="Ej: 3982-0000" required class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white font-mono uppercase outline-none transition">
            </div>
            <div>
                <label class="text-xs font-semibold text-zinc-300">Marca y Modelo</label>
                <input type="text" name="marca_modelo" placeholder="Ej: Dell Latitude" required class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white outline-none transition">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="text-xs font-semibold text-zinc-300">N° Cédula del Estudiante</label>
                <input type="text" name="cedula" placeholder="Ej: 1-1234-0567" required class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white font-mono outline-none transition">
            </div>
            <div>
                <label class="text-xs font-semibold text-zinc-300">Nombre Completo</label>
                <input type="text" name="estudiante" placeholder="Nombre del estudiante" required class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white outline-none transition">
            </div>
        </div>

        <div>
            <label class="text-xs font-semibold text-zinc-300">Sección / Grupo</label>
            <select name="grupo" class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white outline-none transition">
                <optgroup label="Sétimo (7°)">
                    <option value="7-1">7-1</option><option value="7-2">7-2</option><option value="7-3">7-3</option><option value="7-4">7-4</option><option value="7-5">7-5</option><option value="7-6">7-6</option><option value="7-7">7-7</option><option value="7-8">7-8</option><option value="7-9">7-9</option><option value="7-10">7-10</option><option value="7-11">7-11</option><option value="7-12">7-12</option><option value="7-13">7-13</option><option value="7-14">7-14</option>
                </optgroup>
                <optgroup label="Octavo (8°)">
                    <option value="8-1">8-1</option><option value="8-2">8-2</option><option value="8-3">8-3</option><option value="8-4">8-4</option><option value="8-5">8-5</option><option value="8-6">8-6</option><option value="8-7">8-7</option><option value="8-8">8-8</option><option value="8-9">8-9</option><option value="8-10">8-10</option><option value="8-11">8-11</option><option value="8-12">8-12</option>
                </optgroup>
                <optgroup label="Noveno (9°)">
                    <option value="9-1">9-1</option><option value="9-2">9-2</option><option value="9-3">9-3</option><option value="9-4">9-4</option><option value="9-5">9-5</option><option value="9-6">9-6</option><option value="9-7">9-7</option><option value="9-8">9-8</option><option value="9-9">9-9</option><option value="9-10">9-10</option><option value="9-11">9-11</option>
                </optgroup>
                <optgroup label="Décimo (10°)">
                    <option value="10-1">10-1</option><option value="10-2">10-2</option><option value="10-3">10-3</option><option value="10-4">10-4</option><option value="10-5">10-5</option><option value="10-6">10-6</option><option value="10-7">10-7</option><option value="10-8">10-8</option><option value="10-9">10-9</option>
                </optgroup>
                <optgroup label="Undécimo (11°)">
                    <option value="11-1">11-1</option><option value="11-2">11-2</option><option value="11-3">11-3</option><option value="11-4">11-4</option><option value="11-5">11-5</option><option value="11-6">11-6</option><option value="11-7">11-7</option><option value="11-8">11-8</option>
                </optgroup>
            </select>
        </div>

        <div class="flex gap-6 py-1">
            <label class="text-sm text-zinc-300 flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="cargador" value="Sí" checked class="accent-red-600 w-4 h-4 rounded"> Incluye Cargador
            </label>
            <label class="text-sm text-zinc-300 flex items-center gap-2 cursor-pointer">
                <input type="checkbox" name="caja" value="Sí" checked class="accent-red-600 w-4 h-4 rounded"> Entregado en Caja
            </label>
        </div>

        <div>
            <label class="text-xs font-semibold text-zinc-300">Estado Físico Inicial</label>
            <textarea name="estado_inicial" rows="2" class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-500 rounded-xl px-4 py-2 text-white text-sm outline-none transition">Excelente estado.</textarea>
        </div>

        <button type="submit" class="w-full bg-red-700 hover:bg-red-600 text-white font-bold py-3 rounded-xl shadow-lg shadow-red-950/50 transition duration-200 tracking-wide">
            Guardar y Entregar
        </button>
    </form>
</div>
{% endblock %}
