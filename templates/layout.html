<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bitácora de Equipos{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-slate-950 border-b border-slate-800 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <div class="bg-blue-600 text-white p-2 rounded-lg"><i class="fa-solid fa-laptop"></i></div>
                    <span class="font-bold text-lg tracking-wide text-white">BitácoraTec</span>
                </div>
                <div class="flex space-x-2 text-sm font-medium">
                    <a href="{{ url_for('vista_direccion') }}" class="px-3 py-2 rounded-md hover:bg-slate-800 transition text-slate-300">Dirección</a>
                    <a href="{{ url_for('vista_profesor') }}" class="px-3 py-2 rounded-md bg-blue-600 text-white transition">Prestar Equipo</a>
                    <a href="{{ url_for('vista_estudiante') }}" class="px-3 py-2 rounded-md bg-slate-800 text-slate-200 transition">Estudiante</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
