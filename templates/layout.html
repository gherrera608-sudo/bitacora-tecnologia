<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SPEE - Liceo Monseñor Ruben Odio Herrera{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col font-sans">
    <nav class="bg-zinc-950 border-b border-red-900/50 sticky top-0 z-50 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col sm:flex-row items-center justify-between py-3 gap-3">
                <div class="flex items-center space-x-3">
                    <div class="flex items-center justify-center p-1 bg-white rounded-xl shadow-md">
                        <img src="{{ url_for('static', filename='escudo.png') }}" alt="Escudo Liceo" class="h-11 w-auto object-contain">
                    </div>
                    <div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-black text-xl tracking-wider text-red-500">SPEE</span>
                            <span class="text-zinc-300 text-xs sm:text-sm font-semibold border-l border-zinc-700 pl-2">Liceo Monseñor Ruben Odio Herrera</span>
                        </div>
                        <div class="text-[11px] text-zinc-400 font-normal tracking-wide">
                            Sistema de Préstamo de Equipo Estudiantil
                        </div>
                    </div>
                </div>
                
                {# No se muestran botones de navegación para mantener las áreas totalmente separadas #}
            </div>
        </div>
    </nav>
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
