{% extends 'layout.html' %}
{% block title %}Confirmado{% endblock %}
{% block content %}
<div class="max-w-md mx-auto text-center bg-slate-950 border border-slate-800 rounded-2xl p-8">
    <h1 class="text-2xl font-bold text-emerald-400 mb-2">¡Recepción Guardada!</h1>
    <p class="text-slate-400 text-sm mb-4">Se ha registrado la confirmación del equipo <b class="text-white">{{ prestamo.inventario }}</b>.</p>
    <a href="{{ url_for('vista_estudiante') }}" class="inline-block bg-slate-800 text-white px-4 py-2 rounded-xl text-sm">Volver</a>
</div>
{% endblock %}
